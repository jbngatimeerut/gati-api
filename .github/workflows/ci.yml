name: CI
on:
  pull_request:
    branches: [uat, master]
  push:
    branches: [dev, uat, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm install
      - run: npx prisma generate
      - run: npm run build
